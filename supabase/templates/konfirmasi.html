<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konfirmasi akun SiKantin UNUSA</title>
</head>
<body style="margin:0;background:#f2f6f3;color:#19261f;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:500px;background:#ffffff;border:1px solid #dce6df;border-radius:14px">
          <tr>
            <td style="padding:28px;text-align:left">
              <p style="margin:0 0 20px;color:#075438;font-size:15px;font-weight:700">SiKantin UNUSA</p>
              <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3">Konfirmasi email Anda</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.55">Aktifkan akun SiKantin untuk masuk dan mengirim ulasan tenant. Setelah konfirmasi, lanjutkan di halaman Masuk.</p>
              <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}" style="display:inline-block;padding:12px 20px;background:#075438;color:#ffffff;border-radius:8px;font-size:16px;line-height:22px;font-weight:700;text-decoration:none">Aktifkan akun</a>
              <p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #e5ece7;color:#475953;font-size:14px;line-height:1.5">Jika email ini salah alamat, abaikan pesan ini.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
