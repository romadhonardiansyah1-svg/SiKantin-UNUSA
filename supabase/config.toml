project_id = "sikantin-unusa"

[api]
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[analytics]
enabled = false

[realtime]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2MB"

[auth]
site_url = "http://127.0.0.1:8787"
additional_redirect_urls = ["http://127.0.0.1:8787/konfirmasi**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true

[auth.rate_limit]
email_sent = 100

[auth.email.template.confirmation]
subject = "Konfirmasi email SiKantin UNUSA"
content_path = "./supabase/templates/konfirmasi.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/sikantin_email_pendaftaran"
